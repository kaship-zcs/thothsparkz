<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Focus aperture target">
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15110b"/><stop offset=".5" stop-color="#0b0906"/><stop offset="1" stop-color="#050403"/>
    </linearGradient>
    <radialGradient id="f-glow" cx="50%" cy="54%" r="46%">
      <stop offset="0" stop-color="#f4d18a" stop-opacity=".28"/><stop offset="1" stop-color="#f4d18a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f-gold" x1="0" x2="1"><stop offset="0" stop-color="#b77a22"/><stop offset=".5" stop-color="#f4d18a"/><stop offset="1" stop-color="#a96e1e"/></linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#f-bg)"/>
  <rect width="800" height="1000" fill="url(#f-glow)"/>
  <g transform="translate(400 520)">
    <!-- concentric rings -->
    <circle r="250" fill="none" stroke="url(#f-gold)" stroke-width="2" opacity=".25"/>
    <circle r="190" fill="none" stroke="url(#f-gold)" stroke-width="2.5" opacity=".45"/>
    <circle r="130" fill="none" stroke="url(#f-gold)" stroke-width="3" opacity=".7"/>
    <!-- aperture blades -->
    <g fill="none" stroke="url(#f-gold)" stroke-width="6" stroke-linejoin="round" opacity=".92">
      <g id="blade" transform="rotate(0)">
        <path d="M0 -118 L62 -100 L0 -40 Z"/>
      </g>
      <use href="#blade" transform="rotate(60)"/>
      <use href="#blade" transform="rotate(120)"/>
      <use href="#blade" transform="rotate(180)"/>
      <use href="#blade" transform="rotate(240)"/>
      <use href="#blade" transform="rotate(300)"/>
    </g>
    <circle r="30" fill="#f4d18a"/>
    <!-- crosshair -->
    <g stroke="url(#f-gold)" stroke-width="2" opacity=".6">
      <line x1="-250" y1="0" x2="-270" y2="0"/><line x1="250" y1="0" x2="270" y2="0"/>
      <line x1="0" y1="-250" x2="0" y2="-270"/><line x1="0" y1="250" x2="0" y2="270"/>
    </g>
  </g>
  <path d="M620 190 l10 32 32 10 -32 10 -10 32 -10 -32 -32 -10 32 -10z" fill="#f4d18a"/>
</svg>
