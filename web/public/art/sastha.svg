<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Earth movers construction scene">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#241b10"/><stop offset=".55" stop-color="#120d08"/><stop offset="1" stop-color="#070503"/>
    </linearGradient>
    <radialGradient id="s-sun" cx="68%" cy="26%" r="42%">
      <stop offset="0" stop-color="#f4d18a" stop-opacity=".85"/><stop offset=".5" stop-color="#d8a952" stop-opacity=".25"/><stop offset="1" stop-color="#d8a952" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s-gold" x1="0" x2="1"><stop offset="0" stop-color="#b77a22"/><stop offset=".5" stop-color="#f4d18a"/><stop offset="1" stop-color="#a96e1e"/></linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#s-bg)"/>
  <circle cx="544" cy="260" r="340" fill="url(#s-sun)"/>
  <circle cx="544" cy="260" r="46" fill="#f4d18a" opacity=".9"/>
  <!-- distant ridge -->
  <path d="M0 640 L160 560 L320 620 L470 540 L620 610 L800 540 L800 1000 L0 1000Z" fill="#0d0a06" opacity=".9"/>
  <path d="M0 720 L220 660 L430 715 L640 650 L800 700 L800 1000 L0 1000Z" fill="#070503"/>
  <!-- ground -->
  <rect x="0" y="812" width="800" height="188" fill="#050403"/>
  <path d="M0 812 H800" stroke="url(#s-gold)" stroke-width="2" opacity=".5"/>
  <!-- excavator silhouette -->
  <g fill="none" stroke="url(#s-gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
    <!-- tracks -->
    <rect x="150" y="760" width="230" height="52" rx="26"/>
    <circle cx="186" cy="786" r="10" fill="#0b0805"/><circle cx="344" cy="786" r="10" fill="#0b0805"/>
    <!-- cab -->
    <path d="M196 760 L210 672 L320 672 L336 760"/>
    <rect x="232" y="690" width="62" height="46" rx="6"/>
    <!-- boom + arm + bucket -->
    <path d="M318 706 L470 612 L548 668 L470 724"/>
    <path d="M548 668 L612 760 L560 792 L512 724"/>
    <path d="M560 792 q40 26 86 10 l-14 -58"/>
  </g>
  <!-- spark -->
  <path d="M470 150 l10 34 34 10 -34 10 -10 34 -10 -34 -34 -10 34 -10z" fill="#f4d18a"/>
  <!-- grain lines -->
  <g stroke="#d8a952" stroke-width="1" opacity=".08">
    <line x1="0" y1="860" x2="800" y2="860"/><line x1="0" y1="910" x2="800" y2="910"/><line x1="0" y1="960" x2="800" y2="960"/>
  </g>
</svg>
