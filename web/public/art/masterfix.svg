<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Maintenance gears and wrench">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101922"/><stop offset=".55" stop-color="#0a0f14"/><stop offset="1" stop-color="#05080a"/>
    </linearGradient>
    <radialGradient id="m-glow" cx="36%" cy="40%" r="48%">
      <stop offset="0" stop-color="#8fb4cf" stop-opacity=".3"/><stop offset="1" stop-color="#8fb4cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m-gold" x1="0" x2="1"><stop offset="0" stop-color="#b77a22"/><stop offset=".5" stop-color="#f4d18a"/><stop offset="1" stop-color="#a96e1e"/></linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#m-bg)"/>
  <rect width="800" height="1000" fill="url(#m-glow)"/>
  <!-- big gear -->
  <g transform="translate(300 420)" fill="none" stroke="url(#m-gold)" stroke-width="8" opacity=".9">
    <g stroke-width="26">
      <circle r="150" stroke-dasharray="40 38.9"/>
    </g>
    <circle r="150"/>
    <circle r="150" stroke-width="8"/>
    <circle r="56"/>
  </g>
  <circle cx="300" cy="420" r="150" fill="none" stroke="#05080a" stroke-width="10"/>
  <!-- small gear -->
  <g transform="translate(540 610)" fill="none" stroke="url(#m-gold)" stroke-width="7" opacity=".8">
    <g stroke-width="20"><circle r="92" stroke-dasharray="30 27.1"/></g>
    <circle r="92"/><circle r="34"/>
  </g>
  <circle cx="540" cy="610" r="92" fill="none" stroke="#05080a" stroke-width="8"/>
  <!-- wrench -->
  <g transform="rotate(42 470 300)">
    <path d="M430 250 a46 46 0 1 0 64 64 l150 150 a26 26 0 0 1 -36 36 l-150 -150 a46 46 0 0 0 -64 -64 l34 34 -14 30 -30 14 -34 -34 a46 46 0 0 0 46 -130z"
          fill="url(#m-gold)" opacity=".92"/>
  </g>
  <!-- spark -->
  <path d="M150 760 l9 30 30 9 -30 9 -9 30 -9 -30 -30 -9 30 -9z" fill="#f4d18a"/>
</svg>
